<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#ED7D31" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Audit Prosuma</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { -webkit-text-size-adjust: 100%; font-size: 16px; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f5f5f5; color: #111; line-height: 1.5; min-height: 100dvh;
        -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
      }
      input, select, textarea, button { font-family: inherit; font-size: inherit; }
      input[type="text"], input[type="date"], input[type="time"], select, textarea {
        background: #fff; border: 0.5px solid #d1d5db; border-radius: 6px;
        padding: 8px 10px; font-size: 13px; color: #111; outline: none;
        transition: border-color .15s;
      }
      input:focus, select:focus, textarea:focus { border-color: #ED7D31; box-shadow: 0 0 0 2px rgba(237,125,49,.15); }
      ::placeholder { color: #9ca3af; }
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 2px; }
      @media print {
        body { background: #fff !important; }
        .no-print { display: none !important; }
        #rapport-word { border: none !important; padding: 0 !important; box-shadow: none !important; max-width: 100% !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
